function pCal(){const d=new Date(cd+'T00:00'),td=ymd(new Date());let title,body='';
 if(cv==='day'){title=`${DAYS[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}`;const h=HOL[cd.slice(5)],ev=occ(cd);body=(h?`<div class="alert">🎉 ${h}</div>`:'')+(ev.map(evRow).join('')||`<div class="empty">${cd===td?'Сьогодні':'Цього дня'} вільний день.</div>`)}
 else if(cv==='week'){const mo=shift(cd,-((d.getDay()-S.set.ws+7)%7));title=`${mo.slice(8)}.${mo.slice(5,7)} — ${shift(mo,6).slice(8)}.${shift(mo,6).slice(5,7)}`;
  for(let i=0;i<7;i++){const x=shift(mo,i),dd=new Date(x+'T00:00'),ev=occ(x);body+=`<div class="card"><div class="row" style="padding-top:0"><div class="grow" data-a="goday" data-i="${x}"><strong>${DAYS[dd.getDay()]}, ${dd.getDate()} ${MON[dd.getMonth()]}${x===td?' · сьогодні':''}</strong></div></div>${ev.map(evRow).join('')||'<small>Вільно</small>'}</div>`}}
 else{title=`${MONN[d.getMonth()]} ${d.getFullYear()}`;const f=new Date(d.getFullYear(),d.getMonth(),1),dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),off=(f.getDay()-S.set.ws+7)%7;
  body='<div class="card"><div class="month">'+(S.set.ws?['Пн','Вт','Ср','Чт','Пт','Сб','Нд']:['Нд','Пн','Вт','Ср','Чт','Пт','Сб']).map(x=>`<div class="wd">${x}</div>`).join('')+'<span></span>'.repeat(off);
  for(let i=1;i<=dim;i++){const x=`${cd.slice(0,7)}-${pad(i)}`;body+=`<button class="${x===td?'td':''}" data-a="goday" data-i="${x}">${i}${HOL[x.slice(5)]?'🎉':''}<em>${occ(x).slice(0,3).map(e=>`<s style="--c:${esc(e.color)}"></s>`).join('')}</em></button>`}body+='</div></div>'}
 return `<h1>Календар</h1><div class="chips">${[['day','День'],['week','Тиждень'],['month','Місяць']].map(([k,l])=>`<button class="chip ${cv===k?'on':''}" data-a="cv" data-i="${k}">${l}</button>`).join('')}</div>
 <div class="row" style="padding-top:0"><button class="btn" data-a="cnav" data-i="-1">‹</button><div class="grow" style="text-align:center;cursor:default"><strong>${title}</strong></div><button class="btn" data-a="cnav" data-i="1">›</button><button class="btn" data-a="ctoday">Сьогодні</button></div>${body}`}

function pTasks(){const td=ymd(new Date());
 const F={inbox:t=>!t.done&&!t.due,today:t=>!t.done&&t.due&&t.due<=td,upcoming:t=>!t.done&&t.due>td,important:t=>!t.done&&t.pr===1,done:t=>t.done};
 const E={inbox:'Inbox порожній.',today:'Сьогодні все виконано.',upcoming:'Найближчим часом нічого немає.',important:'Важливих завдань немає.',done:'Виконаних завдань ще немає.'};
 const L=S.tasks.filter(F[tf]).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')||a.pr-b.pr);
 return `<h1>Завдання</h1><div class="chips">${[['inbox','Inbox'],['today','Today'],['upcoming','Upcoming'],['important','Important'],['done','Completed']].map(([k,l])=>`<button class="chip ${tf===k?'on':''}" data-a="tf" data-i="${k}">${l}${k!=='done'?' '+S.tasks.filter(F[k]).length:''}</button>`).join('')}</div>
 <div class="card">${L.map(taskRow).join('')||`<div class="empty">${E[tf]}</div>`}<div class="row"><button class="btn pri" data-a="tadd">+ Завдання</button></div></div>
 <h2 style="margin:20px 0 10px">Домашні завдання</h2><div class="card">${S.hw.slice().sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')).map(h=>`<div class="row ${h.st===2?'dn':''}"><div class="grow" data-a="hwedit" data-i="${h.id}"><strong>${esc(h.subj)}</strong><small>${esc(h.t)}${h.due?' · до '+h.due+(h.tm?' '+h.tm:''):''}</small></div><button class="chip" data-a="hwst" data-i="${h.id}">${['Не почато','У процесі','Виконано'][h.st]}</button></div>`).join('')||'<div class="empty">Домашніх завдань немає.</div>'}<div class="row"><button class="btn pri" data-a="hwadd">+ Домашнє</button></div></div>`}

const MODES={'25/5':[25,5],'50/10':[50,10]};

 <div class="ring" id="fring" style="--p:0"><b id="fclock">${r?'':String((S.fm==='custom'?S.fc:MODES[S.fm][0])).padStart(2,'0')+':00'}</b></div>

 <div class="card"><h3>Облік часу</h3>${tm?`<div class="big" id="tmclock" style="font-size:2rem">0:00</div><small>${esc(tm.t)} · ${esc(tm.cat)}</small><div class="row"><button class="btn pri" data-a="tmstop">STOP</button></div>`:`<label>Задача<input id="tmt" placeholder="Напр. Python"></label><label>Категорія<select id="tmc">${TCATS.map(c=>`<option>${c}</option>`).join('')}</select></label><button class="btn pri" data-a="tmstart">START</button>`}</div>

function streak(h){const d=new Date();let n=0;if(!h.log[ymd(d)])d.setDate(d.getDate()-1);while(h.log[ymd(d)]){n++;d.setDate(d.getDate()-1)}return n}

function pStats(){const td=ymd(new Date()),ds=dayStats(td),days=[...Array(7)].map((_,i)=>shift(td,i-6)),prev=[...Array(7)].map((_,i)=>shift(td,i-13));
 const bars=(f,u)=>{const v=days.map(f),mx=Math.max(1,...v);return `<div class="bars">${days.map((x,i)=>`<div title="${u(v[i])}"><i style="height:${v[i]/mx*100}%"></i>${DAYS[new Date(x+'T00:00').getDay()].slice(0,2)}</div>`).join('')}</div>`};
 const agg=ds2=>{const m={};ds2.forEach(x=>{S.time.filter(t=>ymd(new Date(t.ts))===x).forEach(t=>m[t.cat]=(m[t.cat]||0)+t.min);const fm=tot(S.focus,x);if(fm)m.Focus=(m.Focus||0)+fm;const s=social(x);if(s)m['Соцмережі']=(m['Соцмережі']||0)+s});return m};
 const cur=agg(days),pv=agg(prev),keys=[...new Set([...Object.keys(cur),...Object.keys(pv)])].sort((a,b)=>(cur[b]||0)-(cur[a]||0)),mx=Math.max(1,...keys.map(k=>cur[k]||0));
 const sc=S.sc[td]||{};
 return `<div class="grid"><div class="card"><small>Сьогодні</small><p>Завдань виконано <b>${ds.done}</b> · Домашка ${S.hw.filter(h=>h.st===2).length}/${S.hw.length}<br>Навчання <b>${fmtDur(ds.study)}</b> · Focus <b>${fmtDur(ds.focus)}</b><br>Соцмережі <b>${fmtDur(ds.soc)}</b> / ліміт ${fmtDur(S.set.social)}<br>Витрати <b>${fmt(ds.spent)}</b> · Звички <b>${ds.hab}/${S.habits.length}</b></p></div>
 <div class="card"><h3>Screen Time (вручну)</h3><small style="margin-bottom:8px">Браузер не бачить Screen Time iPhone — введи хвилини з налаштувань телефону.</small>${APPS.map(([k,l])=>`<label>${l}, хв<input type="number" min="0" data-sc="${k}" value="${sc[k]||''}"></label>`).join('')}<button class="btn pri" data-a="scsave">Зберегти</button></div></div>
 <div class="card"><h3>Focus за 7 днів</h3>${bars(x=>tot(S.focus,x),fmtDur)}</div><div class="card"><h3>Соцмережі за 7 днів</h3>${bars(social,fmtDur)}</div><div class="card"><h3>Витрати за 7 днів</h3>${bars(x=>dayStats(x).spent,fmt)}</div>
 <div class="card"><h3>Куди пішов мій час (7 днів)</h3>${keys.map(k=>{const dl=(cur[k]||0)-(pv[k]||0);return `<div style="margin-bottom:10px"><div class="row" style="padding:0"><span class="grow" style="cursor:default">${k}</span><b>${fmtDur(cur[k]||0)}</b><small style="width:90px;text-align:right">${dl?(dl>0?'▲ ':'▼ ')+fmtDur(Math.abs(dl)):'без змін'}</small></div><div class="meter"><i style="width:${(cur[k]||0)/mx*100}%"></i></div></div>`}).join('')||'<div class="empty">Дані з\'являться після першого Focus або обліку часу.</div>'}</div>`}

 <div style="margin-top:10px">${fld('morning','Час ранкового брифінгу',s.morning,'time')}${fld('evening','Час вечірнього підсумку',s.evening,'time')}</div></div>

 <div class="card"><h3>Телефон</h3>${(matchMedia('(display-mode: standalone)').matches||navigator.standalone)?'<small>Застосунок уже встановлено на цьому пристрої.</small>':dip?'<button class="btn pri" data-a="install">Встановити як застосунок</button>':'<small>Android (Chrome): меню ⋮ → «Встановити застосунок». iPhone (Safari): «Поділитися» → «На початковий екран».</small>'}</div>
 <div class="card"><h3>Дані й акаунт</h3><small style="margin-bottom:10px">Зберігається в цьому браузері: ${kb} КБ · подій ${S.events.length}, завдань ${S.tasks.length}, нотаток ${S.notes.length}</small><div class="chips"><button class="btn" data-a="exp">Експорт JSON</button><button class="btn" data-a="imp">Імпорт</button><button class="btn dng" data-a="reset">Видалити всі дані</button></div></div>

 const r=S.run;if(r){const left=r.end-Date.now();if(left<=0)return finishRun(true);const f=$('#fclock');if(f){const s=Math.ceil(left/1e3);f.textContent=`${pad(Math.floor(s/60))}:${pad(s%60)}`;$('#fring').style.setProperty('--p',100-left/r.total*100)}document.title=`${pad(Math.floor(left/6e4))}:${pad(Math.ceil(left/1e3)%60)} · MYDAY`}else document.title='MYDAY';
 const t=$('#tmclock');if(t&&S.tm){const m=Math.floor((Date.now()-S.tm.st)/6e4);t.textContent=`${Math.floor(m/60)}:${pad(m%60)}`}

/* 3D-фон: обертова хмара частинок із перспективою */
const cv3=$('#bg3d'),cx=cv3.getContext('2d');let pts=[],raf=0,ang=0,mx=0,my=0;
function bgSync(){cancelAnimationFrame(raf);cx.clearRect(0,0,cv3.width,cv3.height);if(!S.set.bg||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 cv3.width=innerWidth;cv3.height=innerHeight;if(!pts.length)pts=[...Array(90)].map(()=>({x:Math.random()*2-1,y:Math.random()*2-1,z:Math.random()*2-1}));loop()}
function loop(){const w=cv3.width,h=cv3.height,ac=getComputedStyle(document.documentElement).getPropertyValue('--ac').trim()||'#22d3ee',c=Math.cos(ang+=.0025),sn=Math.sin(ang),sc=Math.min(w,h)*.6;
 cx.clearRect(0,0,w,h);cx.strokeStyle=ac;cx.fillStyle=ac;
 const P=pts.map(p=>{const x=p.x*c-p.z*sn,z=p.x*sn+p.z*c,k=1.8/(2.6+z);return{x:w/2+(x+mx*.2)*sc*k*1.2,y:h/2+(p.y+my*.2)*sc*k*1.2,k}});
 for(let i=0;i<P.length;i++){for(let j=i+1;j<P.length;j++){const dx=P[i].x-P[j].x,dy=P[i].y-P[j].y,d=dx*dx+dy*dy;if(d<9000){cx.globalAlpha=(1-d/9000)*.2;cx.beginPath();cx.moveTo(P[i].x,P[i].y);cx.lineTo(P[j].x,P[j].y);cx.stroke()}}
  cx.globalAlpha=.25+P[i].k*.3;cx.beginPath();cx.arc(P[i].x,P[i].y,P[i].k*2.4,0,7);cx.fill()}
 raf=requestAnimationFrame(loop)}
addEventListener('mousemove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
addEventListener('resize',bgSync);document.addEventListener('visibilitychange',bgSync);

const DEFAULT_VAULT={"v":1,"salt":"GHt2tfNdClQHw4dYNtP4eQ==","iter":600000,"chk":{"iv":"6mRRGwULoyqa0N9k","ct":"2XEBZJT95jIAb1OVsmczGVR1diq/QrGA"}};
const TE=new TextEncoder(),TD=new TextDecoder();
const b64=u=>{let s='';const a=new Uint8Array(u);for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)};

async function derive(pw,salt,iter){const k=await crypto.subtle.importKey('raw',TE.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}

async function unseal(key,box){return JSON.parse(TD.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(box.iv)},key,unb64(box.ct))))}
const getVault=()=>{try{return JSON.parse(localStorage.getItem('myday_vault'))||DEFAULT_VAULT}catch{return DEFAULT_VAULT}};
/* «запам'ятати пристрій»: ключ лежить у IndexedDB як неекспортований CryptoKey — прочитати його як текст неможливо */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('myday_k',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbDo=async(mode,fn)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('k',mode),rq=fn(t.objectStore('k'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error)})};
const keyPut=k=>idbDo('readwrite',s=>s.put(k,'main')).catch(()=>{});
const keyGet=()=>idbDo('readonly',s=>s.get('main')).catch(()=>null);
const keyDel=()=>idbDo('readwrite',s=>s.delete('main')).catch(()=>{});
